[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceops-fleet"
version = "0.1.0"
description = "A policy-gated multi-agent evidence operations fleet"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "google-adk==2.7.1",
  "google-cloud-firestore==2.28.1",
  "pydantic==2.12.5",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx2==2.12.0",
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
