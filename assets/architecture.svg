<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">EvidenceOps Fleet architecture</title><desc id="desc">Source-attributed evidence enters Gemini and deterministic specialist agents, persists in Firestore, and stops at a human approval gate before external action.</desc>
  <rect width="1400" height="760" fill="#07111f"/><text x="70" y="82" fill="#eef6ff" font-family="sans-serif" font-size="42" font-weight="700">EvidenceOps Fleet</text><text x="70" y="120" fill="#8fa9bf" font-family="sans-serif" font-size="20">Policy-gated multi-agent evidence operations on Google Cloud</text>
  <g font-family="sans-serif" text-anchor="middle"><g fill="#10243a" stroke="#39d9c8" stroke-width="3"><rect x="70" y="245" width="220" height="130" rx="20"/><rect x="350" y="245" width="220" height="130" rx="20"/><rect x="630" y="245" width="220" height="130" rx="20"/><rect x="910" y="245" width="220" height="130" rx="20"/></g>
  <g fill="#eef6ff" font-size="24" font-weight="700"><text x="180" y="300">Intake Agent</text><text x="460" y="300">Policy Agent</text><text x="740" y="300">Verifier</text><text x="1020" y="300">Supervisor</text></g><g fill="#93a9bf" font-size="16"><text x="180" y="334">Gemini 3.5 Flash</text><text x="460" y="334">Gemini + policy tool</text><text x="740" y="334">Canonical SHA-256</text><text x="1020" y="334">Gemini 3.5 Flash</text></g>
  <g stroke="#7eb8ca" stroke-width="4" fill="none"><path d="M290 310h55"/><path d="M570 310h55"/><path d="M850 310h55"/><path d="M1130 310h90"/></g><g fill="#7eb8ca"><path d="M345 310l-14-9v18z"/><path d="M625 310l-14-9v18z"/><path d="M905 310l-14-9v18z"/><path d="M1220 310l-14-9v18z"/></g>
  <rect x="1220" y="245" width="130" height="130" rx="65" fill="#3a2411" stroke="#ffca66" stroke-width="3"/><text x="1285" y="300" fill="#ffdf9d" font-size="21" font-weight="700">Human</text><text x="1285" y="330" fill="#ffdf9d" font-size="17">approval</text>
  <rect x="350" y="500" width="780" height="120" rx="22" fill="#0b1a2a" stroke="#4e6c87" stroke-width="2"/><text x="740" y="548" fill="#eef6ff" font-size="25" font-weight="700">Cloud Run control plane · Firestore immutable outcomes</text><text x="740" y="585" fill="#93a9bf" font-size="17">Idempotent case IDs · fail-closed conflicts · OpenTelemetry spans · no evidence values in traces</text>
  <path d="M1020 375v120" stroke="#7eb8ca" stroke-width="4"/><path d="M1020 495l-9-14h18z" fill="#7eb8ca"/></g>
